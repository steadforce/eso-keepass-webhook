{{- if .Capabilities.APIVersions.Has "external-secrets.io/v1/ClusterSecretStore" }}
{{- if .Values.clusterSecretStore.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.clusterSecretStore.name }}
  labels:
    {{- include "eso-keepass-webhook.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.clusterSecretStore.conditions }}
  conditions:
  {{- toYaml . | nindent 2 }}
  {{- end }}
  provider:
    webhook:
      # ESO templates (escaped for Helm): key = entry path, property = field.
      url: "http://{{ include "eso-keepass-webhook.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}/v1/secret?path={{`{{ .remoteRef.key }}`}}&property={{`{{ .remoteRef.property }}`}}"
      timeout: 10s
      headers:
        Authorization: "Bearer {{`{{ .auth.token }}`}}"
      secrets:
      - name: auth
        secretRef:
          name: {{ include "eso-keepass-webhook.authSecret" . }}
          namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
