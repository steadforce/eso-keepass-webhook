apiVersion: v1
kind: Service
metadata:
  name: {{ include "eso-keepass-webhook.fullname" . }}
  labels:
    {{- include "eso-keepass-webhook.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    {{- include "eso-keepass-webhook.selectorLabels" . | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
