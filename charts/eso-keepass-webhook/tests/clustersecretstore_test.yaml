suite: ClusterSecretStore
templates:
- templates/clustersecretstore.yaml
release:
  name: eso-keepass-webhook
  namespace: keepass
tests:
- it: points ESO at the webhook's Service with the auth token
  capabilities:
    apiVersions: [external-secrets.io/v1/ClusterSecretStore]
  asserts:
  - isKind:
      of: ClusterSecretStore
  - equal:
      path: metadata.name
      value: keepass
  - equal:
      path: spec.provider.webhook.url
      value: "http://eso-keepass-webhook.keepass.svc:8080/v1/secret?path={{ .remoteRef.key }}&property={{ .remoteRef.property }}"
  - equal:
      path: spec.provider.webhook.secrets[0].secretRef
      value: {name: eso-keepass-webhook-auth, namespace: keepass}

- it: uses the configured name
  capabilities:
    apiVersions: [external-secrets.io/v1/ClusterSecretStore]
  set:
    clusterSecretStore.name: team-keepass
  asserts:
  - equal:
      path: metadata.name
      value: team-keepass

- it: calls the webhook on the configured service port
  capabilities:
    apiVersions: [external-secrets.io/v1/ClusterSecretStore]
  set:
    service.port: 9090
  asserts:
  - matchRegex:
      path: spec.provider.webhook.url
      pattern: ^http://eso-keepass-webhook\.keepass\.svc:9090/v1/secret\?

- it: follows the release name and the namespace
  capabilities:
    apiVersions: [external-secrets.io/v1/ClusterSecretStore]
  release:
    name: kp
    namespace: secrets
  asserts:
  - matchRegex:
      path: spec.provider.webhook.url
      pattern: ^http://kp-eso-keepass-webhook\.secrets\.svc:8080/v1/secret\?
  - equal:
      path: spec.provider.webhook.secrets[0].secretRef
      value: {name: kp-eso-keepass-webhook-auth, namespace: secrets}

- it: uses an existing auth Secret
  capabilities:
    apiVersions: [external-secrets.io/v1/ClusterSecretStore]
  set:
    auth.existingSecret: my-token
  asserts:
  - equal:
      path: spec.provider.webhook.secrets[0].secretRef.name
      value: my-token

- it: can be restricted to some namespaces
  capabilities:
    apiVersions: [external-secrets.io/v1/ClusterSecretStore]
  set:
    clusterSecretStore.conditions:
    - namespaces: [team-a]
    - namespaceSelector:
        matchLabels: {keepass: allowed}
  asserts:
  - equal:
      path: spec.conditions
      value:
      - namespaces: [team-a]
      - namespaceSelector:
          matchLabels: {keepass: allowed}

- it: is usable from every namespace by default
  capabilities:
    apiVersions: [external-secrets.io/v1/ClusterSecretStore]
  asserts:
  - notExists:
      path: spec.conditions

- it: is omitted while the cluster does not serve ESO's API
  asserts:
  - hasDocuments:
      count: 0

- it: is omitted when disabled
  capabilities:
    apiVersions: [external-secrets.io/v1/ClusterSecretStore]
  set:
    clusterSecretStore.enabled: false
  asserts:
  - hasDocuments:
      count: 0
