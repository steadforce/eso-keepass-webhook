name: Lint workflows

on:
  pull_request:
    paths:
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - .github/workflows/**

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The image bundles shellcheck, which actionlint runs over every `run:` block.
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
