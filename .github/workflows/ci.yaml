name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Called by nightly-patch-release.yaml: builds and publishes the given version from the given commit.
  workflow_call:
    inputs:
      version:
        description: "Release version without the v prefix (for example 1.2.3). Empty: the version of the pushed tag, if any."
        type: string
        required: false
        default: ""
      ref:
        description: "Commit to build, empty for the commit of the triggering event"
        type: string
        required: false
        default: ""
      previous_tag:
        description: "Tag the generated release notes start at, empty for GitHub's choice"
        type: string
        required: false
        default: ""

permissions:
  contents: read

# All release runs (tag pushes and calls of the nightly workflow) share one lock, whatever their version: a manual release and a
# nightly release cannot publish at the same time, and the later one starts after the first has finished, when its stale-plan
# guard sees the new tag. A pending run is replaced by a newer pending one, which is only possible when three releases are
# started within one release time. Pull request and branch runs keep a group per ref and are not part of the lock.
concurrency:
  group: ${{ (inputs.version != '' || startsWith(github.ref, 'refs/tags/v')) && 'release' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  HELM_VERSION: v4.3.0
  # Trivy version of all scan and SBOM steps, kept up to date by Renovate (customManagers in renovate.json).
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  SCANNER_TRIVY_VERSION: v0.76.2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The trigger `v*` also matches tags such as `v1` or `vfoo`. The image, the chart and the release wait for this job.
      - name: Refuse a release tag that is invalid or older than the newest release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # vX.Y.Z or vX.Y.Z-rc.1 as in SemVer 2.0 (no leading zeros, no empty identifiers, no build metadata, which Docker tags cannot hold)
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "The tag '$TAG' is not of the form vX.Y.Z (or vX.Y.Z-rc.1). Nothing was published." >&2
            exit 1
          fi
          # A stable release that is older than the newest one (for example a re-run of an older tag) would overwrite the
          # shared image tags `X.Y` and `latest` of the newer release. Prereleases do not touch them.
          if [[ "$TAG" != *-* ]]; then
            refs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq ".[].ref")
            newest=$(printf '%s\n' "$refs" | sed 's#^refs/tags/##' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1 || true)
            if [[ -n "$newest" && "$newest" != "$TAG" ]]; then
              echo "A newer release exists: $newest. $TAG is older, so it would overwrite the shared image tags. Nothing was published." >&2
              exit 1
            fi
          fi
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.13.4
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - run: helm lint --strict charts/eso-keepass-webhook
      - name: helm unittest
        run: |
          docker run --rm -u "$(id -u)" -e HELM_CACHE_HOME=/tmp/helm/.config \
            -v "$PWD:/apps" -w /apps \
            helmunittest/helm-unittest:4.3.0-1.2.1 \
            --strict charts/eso-keepass-webhook

  image:
    # Also waits for the chart, so a release publishes nothing unless everything passed.
    needs: [test, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing with cosign (GitHub OIDC)
      attestations: write
      artifact-metadata: write # storage record of the build provenance attestation, otherwise a warning is logged
    steps:
      - name: Refuse to publish an outdated release plan
        if: ${{ inputs.version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref || github.sha }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          # A re-run of an older nightly run reuses its plan; it must not overwrite a version that a later run released
          # or publish commits that are no longer the head of main.
          set -euo pipefail
          # Fetched on its own, so that a failing API call aborts the step instead of counting as "no tag found"
          refs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq ".[].ref")
          existing=$(printf '%s\n' "$refs" | grep -cxE "refs/tags/v${VERSION//./\\.}" || true)
          if [[ "$existing" != "0" ]]; then
            echo "Tag v${VERSION} already exists, so this plan is outdated. Start a new run of the nightly workflow." >&2
            exit 1
          fi
          # A release that was published after the plan was made (for example a manual minor release) makes the plan obsolete as well.
          newest=$(printf '%s\n' "$refs" | sed 's#^refs/tags/##' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1 || true)
          if [[ -n "$PREVIOUS_TAG" && "$newest" != "$PREVIOUS_TAG" ]]; then
            echo "The newest release is ${newest:-none}, but the plan was made from ${PREVIOUS_TAG}. Start a new run of the nightly workflow." >&2
            exit 1
          fi
          main=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [[ "$main" != "$REF" ]]; then
            echo "Planned commit $REF is not the head of main ($main) any more. Start a new run of the nightly workflow." >&2
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          # `value=` is empty for tag pushes and branch builds, then the metadata comes from the ref. A called release run
          # does not move the branch tag: `:main` belongs to the builds of pushes to main.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version != '' && format('v{0}', inputs.version) || '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version != '' && format('v{0}', inputs.version) || '' }}
            type=ref,event=branch,enable=${{ inputs.version == '' }}
            type=ref,event=pr
            type=sha
      - id: image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "ref=$(printf '%s\n' "$TAGS" | head -n 1)" >> "$GITHUB_OUTPUT"
      # The image that is scanned is the image that is pushed and signed: it is built once and scanned before the push.
      # The scan covers the linux/amd64 build. The other platform only differs in the architecture-specific wheels, which are
      # pinned by hash in uv.lock to the same versions, and shares the base image digest.
      - name: Build the image to scan
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.ref }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      # Fails the build for HIGH and CRITICAL vulnerabilities that have a fixed version, so such an image is never pushed.
      # Pull requests are only reported (exit code 0), otherwise the update that fixes the finding could not be merged.
      # Accepted findings go into .trivyignore (with a comment and an expiry date), which Trivy reads by itself.
      # The scan covers the operating system packages and the Python libraries in /app.
      # Pinned to commit SHAs: in March 2026 most version tags of trivy-action were rewritten to malicious commits.
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          version: ${{ env.SCANNER_TRIVY_VERSION }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      # The checks of the first step ran before the tests, the build and the scan. Repeated right before the push, so that a release
      # that was published meanwhile (for example a manual minor release) is not overwritten, for example the shared tags `1.2` and `latest`.
      - name: Refuse to push when the release plan became outdated
        if: ${{ inputs.version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref || github.sha }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          set -euo pipefail
          refs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq ".[].ref")
          existing=$(printf '%s\n' "$refs" | grep -cxE "refs/tags/v${VERSION//./\\.}" || true)
          if [[ "$existing" != "0" ]]; then
            echo "Tag v${VERSION} exists now, so this plan is outdated. Nothing was pushed." >&2
            exit 1
          fi
          newest=$(printf '%s\n' "$refs" | sed 's#^refs/tags/##' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1 || true)
          if [[ -n "$PREVIOUS_TAG" && "$newest" != "$PREVIOUS_TAG" ]]; then
            echo "The newest release is ${newest:-none}, but the plan was made from ${PREVIOUS_TAG}. Nothing was pushed." >&2
            exit 1
          fi
          main=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [[ "$main" != "$REF" ]]; then
            echo "Planned commit $REF is not the head of main ($main) any more. Nothing was pushed." >&2
            exit 1
          fi
      # Re-running only the failed jobs of an older tag run keeps the result of the check in the test job. Checked again right
      # before the push, so that an older stable release never overwrites the shared image tags `X.Y` and `latest` of a newer one.
      - name: Refuse to push an older stable release
        if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          refs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq ".[].ref")
          newest=$(printf '%s\n' "$refs" | sed 's#^refs/tags/##' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1 || true)
          if [[ -n "$newest" && "$newest" != "$TAG" ]]; then
            echo "A newer release exists: $newest. $TAG is older, so it would overwrite the shared image tags. Nothing was pushed." >&2
            exit 1
          fi
      # The Dockerfile cross-resolves wheels on the host, so no QEMU is needed.
      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Keyless: the signature is bound to the identity of this workflow (GitHub OIDC) and recorded in the Rekor log.
      # It signs the digest of the multi-arch index, so all tags and both platforms are covered. A called run is signed
      # with the identity of this file as well (the called workflow), so one identity pattern verifies every image.
      - name: Sign and verify the image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_DIGEST"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yaml@" \
            "$IMAGE_DIGEST" > /dev/null
          echo "Signed and verified \`$IMAGE_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      # SBOM (CycloneDX) of the scanned linux/amd64 image: operating system packages and Python libraries.
      - name: Generate the SBOM
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          version: ${{ env.SCANNER_TRIVY_VERSION }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"
      # Signed attestation on the image digest (keyless, like the image signature), verified in the same run.
      - name: Attest and verify the SBOM
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE_DIGEST"
          cosign verify-attestation --type cyclonedx \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yaml@" \
            "$IMAGE_DIGEST" > /dev/null
          echo "SBOM attached to \`$IMAGE_DIGEST\` and verified" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the SBOM as a build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json

  release-chart:
    # Tag pushes (manual releases) and calls of the nightly release workflow (inputs.version).
    if: ${{ github.event_name != 'pull_request' && (inputs.version != '' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: [chart, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Package and push chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          helm package charts/eso-keepass-webhook --version "$version" --app-version "$version"
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "eso-keepass-webhook-$version.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"

  github-release:
    if: ${{ github.event_name != 'pull_request' && (inputs.version != '' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: [release-chart, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the SBOM of the image
        uses: actions/download-artifact@v8
        with:
          name: sbom
      # A tag push (manual release) releases the pushed tag. A call of the nightly workflow creates the tag at the planned
      # commit, with GITHUB_TOKEN, which does not start another workflow run.
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref || github.sha }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          asset="eso-keepass-webhook-${version}.cdx.json"
          mv sbom.cdx.json "$asset"
          # A release that was published by hand in the UI (which creates the tag and starts this run) is kept as it is,
          # with its own text: only the SBOM is attached.
          if [[ -z "$INPUT_VERSION" ]] && gh release view "v${version}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v${version} exists already, attaching the SBOM only"
            gh release upload "v${version}" "$asset" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          args=()
          created_tag=false
          if [[ -n "$INPUT_VERSION" ]]; then
            # `gh release create` reuses a tag that exists already, also one that points to another commit (for example a tag
            # that was pushed by hand while this run was building). Never release such a tag: the release would not match
            # the image and chart that were built from INPUT_REF. The tag list is fetched on its own, so that a failing
            # API call aborts the step.
            refs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq ".[].ref")
            existing=$(printf '%s\n' "$refs" | grep -cxE "refs/tags/v${version//./\\.}" || true)
            if [[ "$existing" != "0" ]]; then
              echo "Tag v${version} exists already, so another release of this version was published while this run was building." >&2
              echo "The image and chart of this run may have been overwritten; check them, then start a new nightly run." >&2
              exit 1
            fi
            # A newer stable release than the one the plan started from makes this release stale as well.
            newest=$(printf '%s\n' "$refs" | sed 's#^refs/tags/##' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1 || true)
            if [[ -n "$PREVIOUS_TAG" && "$newest" != "$PREVIOUS_TAG" ]]; then
              echo "The newest release is ${newest:-none}, but this release was planned from ${PREVIOUS_TAG}. No release was created." >&2
              echo "The image and chart of this run may have been published; check them, then start a new nightly run." >&2
              exit 1
            fi
            # The tag is created atomically at the commit that was built: the API refuses (422) when the ref exists already, which closes the gap between the checks
            # above and the release (a tag pushed by hand with the same name at another commit). `gh release create` alone would reuse such a tag, whatever --target says.
            err=$(mktemp)
            if ! gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/v${version}" -f "sha=${INPUT_REF}" > /dev/null 2> "$err"; then
              cat "$err" >&2
              # A failed call does not prove that no tag was created: the server may have created it and the response may have been lost. A new nightly run would then use the tag
              # as its baseline, see no dependency change and skip the release. So the state is looked up and named.
              ref_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" 2> /dev/null || true)
              existing_sha=$(jq -r '.object.sha // empty' <<< "$ref_json" 2> /dev/null || true)
              if [[ -z "$existing_sha" ]]; then
                echo "::error::The tag v${version} could not be created at ${INPUT_REF} and the tag state could not be confirmed (it may exist if the response was lost). No release was created. Check the tag v${version}: delete it if it exists without a release, then start a new nightly run." >&2
              elif [[ "$existing_sha" == "$INPUT_REF" ]]; then
                echo "::error::The tag v${version} exists at the built commit ${INPUT_REF}, but this run did not create the release. Check whether a release of v${version} exists: create it by hand, or delete the tag, before the next nightly run (a retained tag makes the planner skip this version)." >&2
              else
                echo "::error::The tag v${version} exists at ${existing_sha}, not at the built commit ${INPUT_REF}. No release was created. The image and chart of this run may have been published; check them, then start a new nightly run." >&2
              fi
              exit 1
            fi
            created_tag=true
            args+=(--title "v${version}")
            if [[ -n "$PREVIOUS_TAG" ]]; then args+=(--notes-start-tag "$PREVIOUS_TAG"); fi
          fi
          # The release is created from the existing tag only: --verify-tag aborts instead of creating a tag somewhere else.
          args+=(--verify-tag)
          if [[ "$version" == *-* ]]; then args+=(--prerelease); fi  # e.g. v1.0.0-rc.1
          if ! gh release create "v${version}" "$asset" --repo "$GITHUB_REPOSITORY" --generate-notes "${args[@]}" \
            --notes "Image: \`${IMAGE}:${version}\`
          Chart: \`oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/eso-keepass-webhook\` version \`${version}\`"; then
            if [[ "$created_tag" == "true" ]]; then
              # Remove the tag that this step created, so that the next night plans the same version again. Only an explicit 404 of the release lookup proves that the release
              # is absent: a network error or a 5xx answer says nothing (the release may exist although the response was lost), and then the tag stays.
              status=$(gh api -i "repos/${GITHUB_REPOSITORY}/releases/tags/v${version}" 2> /dev/null | sed -n '1s/^HTTP[^ ]* \([0-9][0-9]*\).*/\1/p' || true)
              if [[ "$status" == "404" ]]; then
                # The lookup by tag finds published releases only. `gh release create` with an asset creates a draft first, so a failure during the upload or the
                # publication can leave a draft that blocks the next attempt. The tag is deleted only when the authenticated list of all releases (drafts included)
                # was read completely and does not hold the tag.
                if all=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].tag_name' 2> /dev/null); then
                  if grep -qxF "v${version}" <<< "$all"; then
                    echo "::error::A draft release of v${version} exists: the tag stays. Publish or delete the draft (and the tag), then start a new nightly run." >&2
                  elif gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/v${version}" > /dev/null 2>&1; then
                    echo "The release of v${version} could not be created; the tag was removed again, the next run plans it again." >&2
                  else
                    echo "::error::The release of v${version} could not be created and the tag could not be removed: delete the tag v${version} by hand before the next run." >&2
                  fi
                else
                  echo "::error::The releases could not be listed, so a draft of v${version} cannot be ruled out: the tag stays; check the releases and delete the tag by hand if there is none." >&2
                fi
              elif [[ "$status" == "200" ]]; then
                echo "The release v${version} exists although the command failed: the tag stays." >&2
              else
                echo "::error::The release status of v${version} could not be determined (HTTP ${status:-unknown}): the tag stays; check the release and delete the tag by hand if there is none." >&2
              fi
            fi
            exit 1
          fi
          if [[ "$created_tag" == "true" ]]; then
            # The tag was created above; it has to point to the commit that was built.
            tagged=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" --jq .object.sha)
            if [[ "$tagged" != "$INPUT_REF" ]]; then
              echo "Tag v${version} points to ${tagged}, not to the built commit ${INPUT_REF}" >&2
              exit 1
            fi
          fi

  # Announces published and failed releases (tag pushes and nightly releases) in the Teams release channel.
  # The steps skip themselves while the secret is empty. Called runs need `secrets: inherit` in the caller.
  notify-release:
    name: Notify Teams
    needs: [test, chart, image, release-chart, github-release]
    if: ${{ always() && github.event_name != 'pull_request' && (inputs.version != '' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      MS_TEAMS_RELEASE_WEBHOOK: ${{ secrets.STEADOPS_RELEASE_MS_TEAMS_WEBHOOK }}
      RELEASE_TAG: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - name: Name the image version
        run: echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Notify MS Teams about the published release
        if: ${{ needs.github-release.result == 'success' && env.MS_TEAMS_RELEASE_WEBHOOK != '' }}
        continue-on-error: true
        uses: steadforce/steadops-workflows/.github/actions/teams-notification@v4.3.0
        with:
          webhook-url: ${{ env.MS_TEAMS_RELEASE_WEBHOOK }}
          status: success
          title: "eso-keepass-webhook ${{ env.RELEASE_TAG }} published"
          facts: |
            Image=${{ env.IMAGE }}:${{ env.RELEASE_VERSION }}
            Release=${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}
      - name: Notify MS Teams about the failed release
        if: ${{ needs.github-release.result != 'success' && env.MS_TEAMS_RELEASE_WEBHOOK != '' }}
        continue-on-error: true
        uses: steadforce/steadops-workflows/.github/actions/teams-notification@v4.3.0
        with:
          webhook-url: ${{ env.MS_TEAMS_RELEASE_WEBHOOK }}
          status: failure
          title: "eso-keepass-webhook ${{ env.RELEASE_TAG }} failed"
          facts: |
            Test=${{ needs.test.result }}
            Chart tests=${{ needs.chart.result }}
            Image=${{ needs.image.result }}
            Chart=${{ needs.release-chart.result }}
            Release=${{ needs.github-release.result }}
