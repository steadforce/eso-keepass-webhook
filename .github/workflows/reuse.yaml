name: REUSE compliance

# Checks that every file of the repository has a license and a copyright (REUSE.toml and LICENSES/), so that no source file needs a header.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@v6.0.0
